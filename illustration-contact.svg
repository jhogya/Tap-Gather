  <use href="#sp" x="226" y="88" width="24" height="24"/>
  <use href="#sp" x="98" y="330" width="28" height="28"/>
  <use href="#sp" x="368" y="360" width="22" height="22"/>
  <use href="#sp" x="486" y="360" width="34" height="34"/>
  <use href="#sp" x="502" y="404" width="22" height="22"/>
  <use href="#sp" x="130" y="130" width="14" height="14"/>
  <use href="#sp" x="166" y="120" width="18" height="18"/>
  <use href="#sp" x="240" y="640" width="16" height="16"/>
  <use href="#dt" x="130" y="150" width="30" height="30" opacity=".0"/>
  <use href="#dt" x="98" y="300" width="28" height="28"/>
  <use href="#dt" x="470" y="560" width="40" height="40" transform="translate(30 20)"/>
  <use href="#dt" x="310" y="590" width="44" height="44"/>
</svg>
