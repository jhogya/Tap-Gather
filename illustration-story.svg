<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Illustration of a person working on a laptop surrounded by connected dashboards and charts</title>
  <defs>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H6M0 0V6" stroke="#14171c" stroke-width="1"/></pattern>
    <symbol id="spark" viewBox="-12 -12 24 24"><path d="M0-11C1-4 4-1 11 0 4 1 1 4 0 11-1 4-4 1-11 0-4-1-1-4 0-11Z" fill="#14171c"/></symbol>
    <symbol id="burst" viewBox="-16 -16 32 32"><path d="M0.0,-15.0 L2.8,-7.7 L9.6,-11.5 L7.1,-4.1 L14.8,-2.6 L8.1,1.4 L13.0,7.5 L5.3,6.3 L5.1,14.1 L0.0,8.2 L-5.1,14.1 L-5.3,6.3 L-13.0,7.5 L-8.1,1.4 L-14.8,-2.6 L-7.1,-4.1 L-9.6,-11.5 L-2.8,-7.7Z" fill="#14171c"/></symbol>
    <symbol id="cloud" viewBox="0 0 100 64">
      <g fill="#14171c"><circle cx="40" cy="32" r="24"/><circle cx="70" cy="42" r="15"/><circle cx="20" cy="44" r="14"/><rect x="6" y="42" width="78" height="18" rx="9"/></g>
      <circle cx="30" cy="40" r="11" stroke="#71b0f3" stroke-width="1.6"/><circle cx="52" cy="18" r="6" stroke="#71b0f3" stroke-width="1.6"/>
    </symbol>
    <symbol id="win" viewBox="0 0 74 48">
      <rect x="1" y="1" width="72" height="46" rx="2" stroke="#14171c" stroke-width="1.6"/>
      <path d="M9 15h20M9 22h34M9 29h26M9 36h30" stroke="#14171c" stroke-width="2.4"/>
    </symbol>
    <symbol id="pic" viewBox="0 0 66 58">
      <rect x="1" y="1" width="64" height="56" rx="2" stroke="#14171c" stroke-width="1.6"/>
      <path d="M2 56V36c9-9 15 2 23-4s14 6 22 0 12-6 18-1v25Z" fill="#14171c"/>
      <circle cx="46" cy="17" r="5" stroke="#14171c" stroke-width="1.6"/>
    </symbol>
    <symbol id="panel" viewBox="0 0 66 66"><rect x="1" y="1" width="64" height="64" fill="url(#grid)" stroke="#14171c" stroke-width="1.6"/></symbol>
    <symbol id="smile" viewBox="-20 -20 40 40">
      <circle r="17" stroke="#14171c" stroke-width="1.8"/><path d="M-9 3Q0 12 9 3" stroke="#14171c" stroke-width="1.8"/>
      <path d="M-9-5q3-4 6 0M3-5q3-4 6 0" stroke="#14171c" stroke-width="1.8"/>
    </symbol>
    <symbol id="dots" viewBox="0 0 24 16"><g fill="#14171c"><circle cx="2" cy="2" r="1.3"/><circle cx="12" cy="2" r="1.3"/><circle cx="22" cy="2" r="1.3"/><circle cx="2" cy="8" r="1.3"/><circle cx="12" cy="8" r="1.3"/><circle cx="22" cy="8" r="1.3"/><circle cx="2" cy="14" r="1.3"/><circle cx="12" cy="14" r="1.3"/><circle cx="22" cy="14" r="1.3"/></g></symbol>
  </defs>

  <!-- connector lines -->
  <g stroke="#14171c" stroke-width="1.4">
    <path d="M183 190V262H457V190"/>
    <path d="M265 196V262M350 196V262"/>
    <path d="M330 262V340"/>
    <path d="M457 262Q510 262 510 310V332"/>
    <path d="M410 262H470"/>
    <path d="M150 262V330Q150 348 132 350"/>
    <path d="M560 420Q590 400 612 420"/>
    <path d="M650 500Q676 486 700 500"/>
    <path d="M770 470Q800 500 790 520"/>
  </g>

  <!-- top row -->
  <use href="#cloud" x="272" y="14" width="100" height="64"/>
  <use href="#pic" x="150" y="132" width="66" height="58"/>
  <use href="#panel" x="232" y="130" width="66" height="66"/>
  <use href="#panel" x="318" y="130" width="66" height="66"/>
  <use href="#win" x="420" y="142" width="74" height="48"/>
  <use href="#spark" x="70" y="170" width="24" height="24"/>
  <use href="#dots" x="118" y="212" width="24" height="16"/>
  <use href="#burst" x="404" y="300" width="70" height="70"/>
  <use href="#spark" x="370" y="330" width="26" height="26"/>

  <!-- left cloud + friend -->
  <use href="#cloud" x="40" y="286" width="150" height="96"/>
  <circle cx="130" cy="360" r="14" fill="#14171c"/>
  <circle cx="142" cy="349" r="7" stroke="#14171c" stroke-width="1.6"/>

  <!-- right side -->
  <use href="#pic" x="484" y="330" width="74" height="66"/>
  <use href="#dots" x="570" y="340" width="24" height="16"/>
  <use href="#win" x="578" y="130" width="70" height="46"/>
  <use href="#spark" x="620" y="290" width="26" height="26"/>
  <use href="#panel" x="612" y="452" width="66" height="66"/>
  <use href="#win" x="706" y="452" width="70" height="46"/>
  <use href="#smile" x="700" y="536" width="52" height="52"/>
  <use href="#smile" x="810" y="480" width="52" height="52"/>
  <use href="#cloud" x="740" y="560" width="70" height="44"/>
  <use href="#spark" x="590" y="590" width="20" height="20"/>
  <use href="#spark" x="780" y="410" width="18" height="18"/>
  <use href="#spark" x="850" y="580" width="18" height="18"/>
  <use href="#dots" x="560" y="430" width="24" height="16"/>

  <!-- globe -->
  <g transform="translate(676 372)">
    <circle r="42" fill="#71b0f3" stroke="#14171c" stroke-width="1.6"/>
    <ellipse rx="17" ry="42" stroke="#14171c" stroke-width="1.4"/>
    <path d="M-42 0H42M-37 -20H37M-37 20H37" stroke="#14171c" stroke-width="1.4"/>
  </g>
  <path d="M510 332Q520 300 560 300H636Q676 300 676 330" stroke="#14171c" stroke-width="1.4"/>

  <!-- person: halo, head, hair, torso, sleeve -->
  <path d="M296 452C268 480 262 520 270 566H470C470 506 442 462 392 448" fill="#71b0f3" stroke="#14171c" stroke-width="1.8"/>
  <path d="M302 452C268 470 250 500 262 536L296 530" stroke="#14171c" stroke-width="1.8"/>
  <path d="M262 536l-10 20 24-4" stroke="#14171c" stroke-width="1.6"/>
  <circle cx="338" cy="398" r="54" stroke="#14171c" stroke-width="1.4"/>
  <circle cx="338" cy="400" r="31" fill="#71b0f3" stroke="#14171c" stroke-width="1.8"/>
  <path d="M308 396C304 366 340 358 358 372 372 384 372 404 362 416L358 396C342 394 328 388 322 378 318 388 314 394 308 396Z" fill="#14171c"/>
  <path d="M356 448l6 10" stroke="#14171c" stroke-width="1.8"/>
  <circle cx="322" cy="404" r="2.4" fill="#14171c"/>
  <path d="M316 418q8 6 14 0" stroke="#14171c" stroke-width="1.8"/>
  <path d="M330 398l-8 12 8 3" stroke="#14171c" stroke-width="1.6"/>

  <!-- laptop -->
  <path d="M58 526L92 446Q96 438 104 438L236 440Q246 440 248 450L262 526Z" fill="#14171c"/>
  <path d="M70 518L100 452 232 453 246 518Z" stroke="#71b0f3" stroke-width="1.5"/>
  <ellipse cx="128" cy="486" rx="9" ry="13" fill="#71b0f3" transform="rotate(18 128 486)"/>
  <rect x="44" y="526" width="270" height="16" rx="8" fill="#14171c"/>

  <!-- legs and ground shapes -->
  <path d="M16 610C16 566 54 546 112 546H300C392 546 452 566 500 590L520 610Z" fill="#14171c"/>
  <circle cx="512" cy="562" r="40" fill="#14171c"/>
  <circle cx="558" cy="522" r="24" fill="#14171c"/>
  <circle cx="462" cy="594" r="28" fill="#14171c"/>
  <circle cx="532" cy="556" r="60" stroke="#14171c" stroke-width="1.6"/>
  <use href="#burst" x="536" y="566" width="48" height="48"/>
  <use href="#burst" x="70" y="560" width="36" height="36"/>
  <use href="#spark" x="588" y="500" width="22" height="22"/>
  <path d="M340 590c40 8 84 4 120-10" stroke="#71b0f3" stroke-width="1.6"/>
</svg>
